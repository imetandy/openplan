  <path d="M0 331C133 297 247 355 376 318C486 286 564 264 660 272V400H0V331Z" fill="#7657FF" fill-opacity=".045"/>
  <path d="M0 355C141 322 256 378 397 337C500 307 577 293 660 300" stroke="#55D6FF" stroke-opacity=".08"/>

