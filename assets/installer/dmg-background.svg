  <text x="366" y="68" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="720">OpenPlan</text>
  <text x="330" y="96" fill="#AEB4C3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="520">Every conversation. One native workspace.</text>

